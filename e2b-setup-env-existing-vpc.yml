AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  E2B Infrastructure CloudFormation Template (Existing VPC) - Deploys core infrastructure components for E2B platform
  using existing VPC including IAM Roles, PostgreSQL Database, and S3 Buckets.

# ===================================================================================================
# Metadata - Organizes template parameters into logical groups in the CloudFormation console
# ===================================================================================================
Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: Existing VPC Configuration
        Parameters:
          - ExistingVpcId
          - ExistingPrivateSubnet1Id
          - ExistingPrivateSubnet2Id
          - ExistingPublicSubnet1Id
          - ExistingPublicSubnet2Id
          - PublicAccess
      - Label:
          default: Security Configuration
        Parameters:
          - AllowRemoteSSHIPs
      - Label:
          default: E2B Environment
        Parameters:
          - Environment
      - Label:
          default: Architecture Configuration
        Parameters:
          - Architecture
      - Label:
          default: Client Cluster Configuration
        Parameters:
          - ClientInstanceType
      - Label:
          default: Domain Configuration
        Parameters:
          - BaseDomain
      - Label:
          default: Bastion Configuration
        Parameters:
          - KeyName
      - Label:
          default: Database Configuration
        Parameters:
          - DBInstanceIdentifier
          - DBName
          - DBUsername
          - DBPassword
      - Label:
          default: External S3 Buckets
        Parameters:
          - ExistingE2BBucketName
          - ExistingLokiBucketName
          - ExistingTemplatesBucketName
          - ExistingBuildCacheBucketName
      - Label:
          default: Custom Configuration
        Parameters:
          - CFNCustomScriptUrl
          - RepoBranch

# ===================================================================================================
# Parameters - Input values required for the E2B infrastructure deployment
# ===================================================================================================
Parameters:
  # E2B Environment Configuration
  Environment:
    Description: "E2B Environment"
    Type: String
    AllowedValues:
      - prod
      - dev
    Default: prod

  # Architecture Configuration - Choose CPU architecture
  Architecture:
    Description: "Choose between x86_64 (Intel/AMD compatible) and arm64 (AWS Graviton) processor architectures."
    Type: String
    AllowedValues:
      - x86_64
      - arm64

  # Client Cluster Configuration - Instance type for client nodes
  ClientInstanceType:
    Description: "Instance type for client cluster nodes (must support nested virtualization, e.g. *.metal). Leave empty to use architecture default (x86: c5.metal, arm64: c7g.metal)."
    Type: String
    Default: ""

  # Domain Configuration - Settings for SSL certificate and DNS
  BaseDomain:
    Type: String
    Description: >-
      Base domain name (e.g. domain.com or sub.domain.com).
      Wildcard certificate will be issued for *.{BaseDomain}
    AllowedPattern: '^([a-zA-Z0-9-]+\.)+[a-zA-Z]{2,}$'
    ConstraintDescription: Must be a valid domain (e.g. sub.domain.com)

  # Existing VPC Configuration
  ExistingVpcId:
    Type: AWS::EC2::VPC::Id
    Description: ID of the existing VPC where E2B infrastructure will be deployed

  ExistingPrivateSubnet1Id:
    Type: AWS::EC2::Subnet::Id
    Description: ID of existing private subnet in first availability zone

  ExistingPrivateSubnet2Id:
    Type: AWS::EC2::Subnet::Id
    Description: ID of existing private subnet in second availability zone

  ExistingPublicSubnet1Id:
    Type: AWS::EC2::Subnet::Id
    Description: ID of existing public subnet in first availability zone(not available in private access mode)

  ExistingPublicSubnet2Id:
    Type: AWS::EC2::Subnet::Id
    Description: ID of existing public subnet in second availability zone(not available in private access mode)

  PublicAccess:
    Type: String
    Description: Specify whether public or private access to E2B
    AllowedValues:
      - public
      - private
    Default: public

  # Bastion Configuration - Settings for the deployment and management server
  KeyName:
    Description: EC2 Key Pair name for SSH access to the bastion host (deployment server)
    Type: AWS::EC2::KeyPair::KeyName
    ConstraintDescription: Must be the name of an existing EC2 KeyPair in this region.

  # Security Configuration - Access control settings
  AllowRemoteSSHIPs:
    Description: IP address range allowed for SSH (port 22) access to the bastion host (CIDR format), if you want to allow all IPs, please set it to '0.0.0.0/0'
    Type: String
    Default: "0.0.0.0/0"

  # Database Configuration - PostgreSQL settings for E2B platform
  DBInstanceIdentifier:
    Type: String
    Default: e2b-aurora-db
    Description: Unique identifier for the Aurora PostgreSQL database cluster
  DBName:
    Type: String
    Default: e2b
    Description: Initial database name for E2B application data (must be characters with letters and numbers)
  DBUsername:
    Type: String
    NoEcho: true
    Description: Master username for PostgreSQL database (will not be displayed in console)
  DBPassword:
    Type: String
    NoEcho: true
    Description: Master password for PostgreSQL database (must be 8-30 characters with letters and numbers)
    AllowedPattern: ^(?=.*[a-zA-Z])(?=.*\d)[a-zA-Z0-9]{8,30}$
    ConstraintDescription: Password must be 8-30 characters and contain at least one letter and one number

  # External S3 Bucket Configuration
  ExistingE2BBucketName:
    Type: String
    Default: ""
    Description: "Name of an existing unified E2B S3 bucket. Leave empty to auto-create."

  ExistingLokiBucketName:
    Type: String
    Default: ""
    Description: "Name of an existing Loki log storage S3 bucket. Leave empty to auto-create."

  # Dedicated buckets required by the orchestrator storage layer.
  # Upstream removed TEMPLATE_BUCKET_PREFIX, so these roles cannot share the
  # unified E2B bucket via key prefixes any more - each needs its own bucket.
  ExistingTemplatesBucketName:
    Type: String
    Default: ""
    Description: "Name of an existing sandbox template S3 bucket (TEMPLATE_BUCKET_NAME). Leave empty to auto-create."

  ExistingBuildCacheBucketName:
    Type: String
    Default: ""
    Description: "Name of an existing template build cache S3 bucket (BUILD_CACHE_BUCKET_NAME). Leave empty to auto-create."

  # Custom Script Configuration
  CFNCustomScriptUrl:
    Type: String
    Default: ""
    Description: "URL of a custom script to run on instances after startup (S3 or HTTP). Leave empty to skip."

  # Source Configuration
  RepoBranch:
    Type: String
    Default: main
    Description: >-
      Git branch of aws-samples/sample-e2b-on-aws that the bastion checks out.
      Leaving the branch to the remote default would put the bastion on a
      different code layer than the one this stack was built from.

# ===================================================================================================
# Conditions - Conditional logic for resource creation
# ===================================================================================================
Conditions:
  IsX64: !Equals [!Ref Architecture, x86_64]
  IsArm64: !Equals [!Ref Architecture, arm64]
  IsProd: !Equals [!Ref Environment, prod]
  HasCustomClientInstanceType: !Not [!Equals [!Ref ClientInstanceType, ""]]
  HasExternalE2BBucket: !Not [!Equals [!Ref ExistingE2BBucketName, ""]]
  HasExternalLokiBucket: !Not [!Equals [!Ref ExistingLokiBucketName, ""]]
  CreateE2BBucket: !Equals [!Ref ExistingE2BBucketName, ""]
  CreateLokiBucket: !Equals [!Ref ExistingLokiBucketName, ""]
  HasExternalTemplatesBucket: !Not [!Equals [!Ref ExistingTemplatesBucketName, ""]]
  HasExternalBuildCacheBucket: !Not [!Equals [!Ref ExistingBuildCacheBucketName, ""]]
  CreateTemplatesBucket: !Equals [!Ref ExistingTemplatesBucketName, ""]
  CreateBuildCacheBucket: !Equals [!Ref ExistingBuildCacheBucketName, ""]
  IsPrivateAccess: !Equals [!Ref PublicAccess, private]

# ===================================================================================================
# Resources - AWS resources to be provisioned for the E2B infrastructure
# ===================================================================================================
Resources:
  # ------------------------------------------------------------------------------------------------
  # VPC CIDR Lookup - Custom resource to automatically retrieve VPC CIDR block
  # ------------------------------------------------------------------------------------------------
  VpcLookupRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: VpcDescribePolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - ec2:DescribeVpcs
                Resource: "*"

  VpcLookupFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-vpc-lookup"
      Runtime: python3.9
      Handler: index.handler
      Role: !GetAtt VpcLookupRole.Arn
      Timeout: 60
      Code:
        ZipFile: |
          import boto3
          import json
          import cfnresponse

          def handler(event, context):
              try:
                  if event['RequestType'] == 'Delete':
                      cfnresponse.send(event, context, cfnresponse.SUCCESS, {})
                      return

                  ec2 = boto3.client('ec2')
                  vpc_id = event['ResourceProperties']['VpcId']

                  response = ec2.describe_vpcs(VpcIds=[vpc_id])

                  if not response['Vpcs']:
                      raise Exception(f'VPC {vpc_id} not found')

                  vpc = response['Vpcs'][0]
                  cidr_block = vpc['CidrBlock']

                  response_data = {'CidrBlock': cidr_block}
                  cfnresponse.send(event, context, cfnresponse.SUCCESS, response_data)

              except Exception as e:
                  print(f'Error: {str(e)}')
                  cfnresponse.send(event, context, cfnresponse.FAILED, {})

  VpcCidrLookup:
    Type: AWS::CloudFormation::CustomResource
    Properties:
      ServiceToken: !GetAtt VpcLookupFunction.Arn
      VpcId: !Ref ExistingVpcId

  # ------------------------------------------------------------------------------------------------
  # VPC Endpoint - Provides private access to S3 without traversing the public internet
  # ------------------------------------------------------------------------------------------------
  S3VPCEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      ServiceName: !Sub "com.amazonaws.${AWS::Region}.s3"
      VpcId: !Ref ExistingVpcId
      VpcEndpointType: Gateway
      # Note: You may need to specify existing route table IDs for your VPC
      # RouteTableIds:
      #   - existing-route-table-id-1
      #   - existing-route-table-id-2

  # ------------------------------------------------------------------------------------------------
  # Security Groups - Network access control for different infrastructure tiers
  # ------------------------------------------------------------------------------------------------
  BastionSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security group allowing SSH connections to the bastion host from specified IP ranges
      VpcId: !Ref ExistingVpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: "22"
          ToPort: "22"
          CidrIp: !Ref AllowRemoteSSHIPs
      SecurityGroupEgress:
        - IpProtocol: "-1"
          CidrIp: "0.0.0.0/0"
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-bastion-sg"

  DBSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security group controlling access to the PostgreSQL database (port 5432)
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          CidrIp: !GetAtt VpcCidrLookup.CidrBlock
      SecurityGroupEgress:
        - IpProtocol: "-1"
          CidrIp: "0.0.0.0/0"
      VpcId: !Ref ExistingVpcId
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-db-sg"

  RedisSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security group controlling access to the Redis cache (port 6379)
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 6379
          ToPort: 6379
          CidrIp: !GetAtt VpcCidrLookup.CidrBlock
      SecurityGroupEgress:
        - IpProtocol: "-1"
          CidrIp: "0.0.0.0/0"
      VpcId: !Ref ExistingVpcId
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-redis-sg"

  # ------------------------------------------------------------------------------------------------
  # IAM - Identity and Access Management roles and policies for secure resource access
  # ------------------------------------------------------------------------------------------------
  EC2ServiceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - ec2.amazonaws.com
            Action:
              - sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
      Policies:
        - PolicyName: E2BDeploymentPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: S3Access
                Effect: Allow
                Action:
                  - s3:CreateBucket
                  - s3:DeleteBucket
                  - s3:GetObject
                  - s3:PutObject
                  - s3:DeleteObject
                  - s3:ListBucket
                  - s3:GetBucketLocation
                  - s3:GetBucketVersioning
                  - s3:PutBucketVersioning
                  - s3:PutBucketPolicy
                  - s3:GetBucketPolicy
                  - s3:PutBucketTagging
                  - s3:GetBucketTagging
                  - s3:PutEncryptionConfiguration
                  - s3:GetEncryptionConfiguration
                  - s3:PutBucketPublicAccessBlock
                  - s3:GetBucketPublicAccessBlock
                  - s3:GetBucketAcl
                  - s3:PutBucketAcl
                  - s3:GetBucketCors
                  - s3:PutBucketCors
                  - s3:GetBucketWebsite
                  - s3:PutBucketWebsite
                  - s3:GetAccelerateConfiguration
                  - s3:PutAccelerateConfiguration
                  - s3:GetBucketRequestPayment
                  - s3:PutBucketRequestPayment
                  - s3:GetBucketLogging
                  - s3:PutBucketLogging
                  - s3:GetLifecycleConfiguration
                  - s3:PutLifecycleConfiguration
                  - s3:GetReplicationConfiguration
                  - s3:PutReplicationConfiguration
                  - s3:GetBucketObjectLockConfiguration
                  - s3:PutBucketObjectLockConfiguration
                  - s3:GetObjectTagging
                  - s3:PutObjectTagging
                Resource:
                  - "arn:aws:s3:::*e2b*"
                  - "arn:aws:s3:::*e2b*/*"
                  - "arn:aws:s3:::terraform-*"
                  - "arn:aws:s3:::terraform-*/*"
                  - "arn:aws:s3:::software-*"
                  - "arn:aws:s3:::software-*/*"
                  # Covers every bucket this stack creates, including the
                  # templates / build-cache buckets whose names do not
                  # necessarily contain "e2b".
                  - !Sub "arn:aws:s3:::${AWS::StackName}-*"
                  - !Sub "arn:aws:s3:::${AWS::StackName}-*/*"
              - Sid: SecretsManagerAccess
                Effect: Allow
                Action:
                  - secretsmanager:CreateSecret
                  - secretsmanager:GetSecretValue
                  - secretsmanager:PutSecretValue
                  - secretsmanager:DeleteSecret
                  - secretsmanager:DescribeSecret
                  - secretsmanager:GetResourcePolicy
                  - secretsmanager:TagResource
                  - secretsmanager:UntagResource
                  - secretsmanager:UpdateSecret
                Resource: !Sub "arn:aws:secretsmanager:*:${AWS::AccountId}:secret:*e2b*"
              - Sid: EC2PackerAccess
                Effect: Allow
                Action:
                  - ec2:AttachVolume
                  - ec2:AuthorizeSecurityGroupIngress
                  - ec2:AuthorizeSecurityGroupEgress
                  - ec2:CopyImage
                  - ec2:CreateImage
                  - ec2:CreateKeypair
                  - ec2:CreateSecurityGroup
                  - ec2:CreateSnapshot
                  - ec2:CreateTags
                  - ec2:CreateVolume
                  - ec2:CreateLaunchTemplate
                  - ec2:CreateLaunchTemplateVersion
                  - ec2:CreateNetworkInterface
                  - ec2:DeleteKeyPair
                  - ec2:DeleteSecurityGroup
                  - ec2:DeleteSnapshot
                  - ec2:DeleteVolume
                  - ec2:DeleteLaunchTemplate
                  - ec2:DeleteNetworkInterface
                  - ec2:DeregisterImage
                  - ec2:DescribeImageAttribute
                  - ec2:DescribeImages
                  - ec2:DescribeInstances
                  - ec2:DescribeInstanceStatus
                  - ec2:DescribeRegions
                  - ec2:DescribeSecurityGroups
                  - ec2:DescribeSnapshots
                  - ec2:DescribeSubnets
                  - ec2:DescribeTags
                  - ec2:DescribeVolumes
                  - ec2:DescribeLaunchTemplates
                  - ec2:DescribeLaunchTemplateVersions
                  - ec2:DescribeVpcs
                  - ec2:DescribeAvailabilityZones
                  - ec2:DescribeKeyPairs
                  - ec2:DescribeNetworkInterfaces
                  - ec2:DescribeAccountAttributes
                  - ec2:DescribeInternetGateways
                  - ec2:DescribeInstanceTypes
                  - ec2:DetachVolume
                  - ec2:GetPasswordData
                  - ec2:ModifyImageAttribute
                  - ec2:ModifyInstanceAttribute
                  - ec2:ModifySnapshotAttribute
                  - ec2:ModifyLaunchTemplate
                  - ec2:RegisterImage
                  - ec2:RunInstances
                  - ec2:StopInstances
                  - ec2:TerminateInstances
                  - ec2:RevokeSecurityGroupIngress
                  - ec2:RevokeSecurityGroupEgress
                Resource: "*"
              - Sid: AutoScalingAndELB
                Effect: Allow
                Action:
                  - autoscaling:*
                  - elasticloadbalancing:*
                Resource: "*"
              - Sid: ECRAccess
                Effect: Allow
                Action:
                  - ecr:GetAuthorizationToken
                  - ecr:BatchCheckLayerAvailability
                  - ecr:GetDownloadUrlForLayer
                  - ecr:BatchGetImage
                  - ecr:PutImage
                  - ecr:InitiateLayerUpload
                  - ecr:UploadLayerPart
                  - ecr:CompleteLayerUpload
                  - ecr:CreateRepository
                  - ecr:DeleteRepository
                  - ecr:DescribeRepositories
                  - ecr:ListImages
                  - ecr:DescribeImages
                  - ecr:TagResource
                Resource:
                  - "*"
                  - !Sub "arn:aws:ecr:*:${AWS::AccountId}:repository/e2b-*"
              - Sid: IAMAccess
                Effect: Allow
                Action:
                  - iam:CreateRole
                  - iam:DeleteRole
                  - iam:GetRole
                  - iam:ListRoles
                  - iam:UpdateRole
                  - iam:TagRole
                  - iam:UntagRole
                  - iam:CreateInstanceProfile
                  - iam:DeleteInstanceProfile
                  - iam:GetInstanceProfile
                  - iam:ListInstanceProfiles
                  - iam:ListInstanceProfilesForRole
                  - iam:AddRoleToInstanceProfile
                  - iam:RemoveRoleFromInstanceProfile
                  - iam:CreatePolicy
                  - iam:DeletePolicy
                  - iam:GetPolicy
                  - iam:GetPolicyVersion
                  - iam:ListPolicies
                  - iam:ListPolicyVersions
                  - iam:ListAttachedRolePolicies
                  - iam:AttachRolePolicy
                  - iam:DetachRolePolicy
                  - iam:PutRolePolicy
                  - iam:GetRolePolicy
                  - iam:DeleteRolePolicy
                  - iam:ListRolePolicies
                  - iam:TagPolicy
                  - iam:UntagPolicy
                Resource:
                  - !Sub "arn:aws:iam::${AWS::AccountId}:role/*e2b*"
                  - !Sub "arn:aws:iam::${AWS::AccountId}:instance-profile/*e2b*"
                  - !Sub "arn:aws:iam::${AWS::AccountId}:policy/*e2b*"
              - Sid: IAMAttachAWSManagedPolicy
                Effect: Allow
                Action:
                  - iam:AttachRolePolicy
                  - iam:DetachRolePolicy
                Resource: !Sub "arn:aws:iam::${AWS::AccountId}:role/*e2b*"
                Condition:
                  ArnEquals:
                    iam:PolicyARN:
                      - arn:aws:iam::aws:policy/AmazonEC2ContainerRegistryReadOnly
                      - arn:aws:iam::aws:policy/CloudWatchAgentServerPolicy
                      - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
                      - arn:aws:iam::aws:policy/AmazonEC2FullAccess
                      - arn:aws:iam::aws:policy/AmazonEC2ContainerRegistryFullAccess
                      - arn:aws:iam::aws:policy/AmazonS3FullAccess
                      - arn:aws:iam::aws:policy/SecretsManagerReadWrite
                      - arn:aws:iam::aws:policy/service-role/AmazonEC2ContainerServiceforEC2Role
              - Sid: IAMPassRole
                Effect: Allow
                Action:
                  - iam:PassRole
                Resource: !Sub "arn:aws:iam::${AWS::AccountId}:role/*e2b*"
                Condition:
                  StringEquals:
                    iam:PassedToService:
                      - ec2.amazonaws.com
              - Sid: IAMCreateServiceLinkedRole
                Effect: Allow
                Action:
                  - iam:CreateServiceLinkedRole
                Resource:
                  - "arn:aws:iam::*:role/aws-service-role/autoscaling.amazonaws.com/*"
                  - "arn:aws:iam::*:role/aws-service-role/elasticloadbalancing.amazonaws.com/*"
                Condition:
                  StringEquals:
                    iam:AWSServiceName:
                      - autoscaling.amazonaws.com
                      - elasticloadbalancing.amazonaws.com
              - Sid: LogsAndMonitoring
                Effect: Allow
                Action:
                  - logs:*
                  - cloudwatch:*
                Resource: "*"
              - Sid: ElastiCacheAccess
                Effect: Allow
                Action:
                  - elasticache:DescribeCacheClusters
                  - elasticache:DescribeServerlessCaches
                Resource: "*"
              - Sid: CloudFormation
                Effect: Allow
                Action:
                  - cloudformation:DescribeStacks
                  - cloudformation:ListStacks
                Resource: "*"
              - Sid: SSMAccess
                Effect: Allow
                Action:
                  - ssm:GetParameter*
                  - ssm:PutParameter
                  - ssm:DeleteParameter
                  - ssm:DescribeParameters
                Resource: !Sub "arn:aws:ssm:*:${AWS::AccountId}:parameter/*e2b*"
              # Run Command against the cluster nodes. The bastion drives the
              # deploy chain but has no SSH key for the nodes, so this is the
              # only way to read /var/log/cloud-init-output.log or a failing
              # nomad/consul unit when a node does not join the cluster.
              - Sid: SSMRunCommandInstances
                Effect: Allow
                Action:
                  - ssm:SendCommand
                Resource: !Sub "arn:aws:ec2:${AWS::Region}:${AWS::AccountId}:instance/*"
                Condition:
                  StringLike:
                    ssm:resourceTag/Name: !Sub "${AWS::StackName}-*"
              - Sid: SSMRunCommandDocument
                Effect: Allow
                Action:
                  - ssm:SendCommand
                Resource: !Sub "arn:aws:ssm:${AWS::Region}::document/AWS-RunShellScript"
              - Sid: SSMRunCommandResults
                Effect: Allow
                Action:
                  - ssm:GetCommandInvocation
                  - ssm:ListCommandInvocations
                Resource: "*"
              - Sid: STSAccess
                Effect: Allow
                Action:
                  - sts:GetCallerIdentity
                Resource: "*"
      Description: IAM role with complete permissions for E2B infrastructure deployment including Packer and Terraform

  EC2InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Path: /
      Roles:
        - !Ref EC2ServiceRole

  # ------------------------------------------------------------------------------------------------
  # Secrets Manager - Encrypted storage for database credentials
  # ------------------------------------------------------------------------------------------------
  DBCredentialSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub "e2b-${AWS::StackName}-db-credential"
      Description: PostgreSQL database credentials (JSON) encrypted in AWS Secrets Manager
      SecretString: !Sub
        - '{"host":"${DBEndpoint}","port":"5432","dbname":"${DBName}","username":"${DBUsername}","password":"${DBPassword}"}'
        - DBEndpoint: !GetAtt AuroraCluster.Endpoint.Address

  # ------------------------------------------------------------------------------------------------
  # Certificate - SSL/TLS certificate for secure HTTPS communication
  # ------------------------------------------------------------------------------------------------
  WildcardCertificate:
    Type: AWS::CertificateManager::Certificate
    Properties:
      DomainName: !Sub "*.${BaseDomain}"
      ValidationMethod: DNS
      DomainValidationOptions:
        - DomainName: !Sub "*.${BaseDomain}"
          ValidationDomain: !Ref BaseDomain

  # ------------------------------------------------------------------------------------------------
  # Application Load Balancer
  #
  # Deliberately owned by CloudFormation rather than Terraform. The wildcard
  # certificate above lives for the life of the stack, but a Terraform-managed
  # load balancer is destroyed and recreated by `terraform destroy` / `apply`,
  # and each new one gets a different DNS name. That forced the wildcard DNS
  # record to be re-pointed by hand after every rebuild - the one manual step
  # left in an otherwise unattended deployment. Keeping the load balancer on the
  # same lifecycle as the certificate makes the DNS record a one-time setup.
  #
  # Terraform still owns the autoscaling groups and attaches them to the target
  # groups below through the ARNs exported in this stack's outputs.
  # ------------------------------------------------------------------------------------------------
  ALBSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security group for the E2B application load balancer
      VpcId: !Ref ExistingVpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
          Description: HTTP
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
          Description: HTTPS
      SecurityGroupEgress:
        - IpProtocol: "-1"
          CidrIp: 0.0.0.0/0
          Description: Allow all outbound traffic
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-alb-sg"

  ApplicationLoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: !Sub "${AWS::StackName}-alb"
      Type: application
      Scheme: !If [IsPrivateAccess, internal, internet-facing]
      SecurityGroups:
        - !GetAtt ALBSecurityGroup.GroupId
      Subnets: !If
        - IsPrivateAccess
        - [!Ref ExistingPrivateSubnet1Id, !Ref ExistingPrivateSubnet2Id]
        - [!Ref ExistingPublicSubnet1Id, !Ref ExistingPublicSubnet2Id]
      LoadBalancerAttributes:
        # Long enough that a paused sandbox request is not cut off mid-flight.
        - Key: idle_timeout.timeout_seconds
          Value: "120"
        - Key: deletion_protection.enabled
          Value: !If [IsProd, "true", "false"]
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-alb"

  # Nomad server UI / API.
  NomadServerTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: !Sub "${AWS::StackName}-nomad-server"
      VpcId: !Ref ExistingVpcId
      Port: 4646
      Protocol: HTTP
      HealthCheckProtocol: HTTP
      HealthCheckPath: /ui/
      HealthCheckIntervalSeconds: 30
      HealthCheckTimeoutSeconds: 5
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 2
      Matcher:
        HttpCode: "200"
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-nomad-server"

  # E2B API.
  E2BApiTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: !Sub "${AWS::StackName}-e2b-api"
      VpcId: !Ref ExistingVpcId
      Port: 50001
      Protocol: HTTP
      HealthCheckProtocol: HTTP
      HealthCheckPath: /health
      HealthCheckIntervalSeconds: 30
      HealthCheckTimeoutSeconds: 5
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 2
      Matcher:
        HttpCode: "200"
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-e2b-api"

  # Sandbox traffic. Served on 3002, health-checked on 3001, matching the
  # proxy / health port pair in nomad/origin/edge.hcl.
  ClientProxyTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: !Sub "${AWS::StackName}-client-proxy"
      VpcId: !Ref ExistingVpcId
      Port: 3002
      Protocol: HTTP
      HealthCheckProtocol: HTTP
      HealthCheckPort: "3001"
      HealthCheckPath: /health
      HealthCheckIntervalSeconds: 30
      HealthCheckTimeoutSeconds: 5
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 2
      Matcher:
        HttpCode: "200"
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-client-proxy"

  # Sandbox subdomains are dynamic, so client-proxy is the catch-all default and
  # the two fixed hostnames are matched by higher-priority rules.
  ALBHttpsListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref ApplicationLoadBalancer
      Port: 443
      Protocol: HTTPS
      SslPolicy: ELBSecurityPolicy-TLS13-1-2-2021-06
      Certificates:
        - CertificateArn: !Ref WildcardCertificate
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref ClientProxyTargetGroup

  ALBApiListenerRule:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Properties:
      ListenerArn: !Ref ALBHttpsListener
      Priority: 10
      Actions:
        - Type: forward
          TargetGroupArn: !Ref E2BApiTargetGroup
      Conditions:
        - Field: host-header
          Values:
            - !Sub "api.${BaseDomain}"

  ALBNomadListenerRule:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Properties:
      ListenerArn: !Ref ALBHttpsListener
      Priority: 30
      Actions:
        - Type: forward
          TargetGroupArn: !Ref NomadServerTargetGroup
      Conditions:
        - Field: host-header
          Values:
            - !Sub "nomad.${BaseDomain}"

  # ------------------------------------------------------------------------------------------------
  # S3 Buckets - Unified E2B bucket, Loki log storage, and the two dedicated
  # orchestrator storage buckets (templates / build cache).
  #
  # The unified E2B bucket still serves everything addressed by our own boot
  # scripts via key prefixes (fc-env-pipeline/, fc-kernels/, fc-versions/,
  # fc-busybox/, software/, cluster-setup/). The template and build-cache roles
  # are addressed by the Go storage layer instead, which no longer supports a
  # key prefix, so they each require a dedicated bucket.
  # ------------------------------------------------------------------------------------------------
  E2BBucket:
    Type: AWS::S3::Bucket
    Condition: CreateE2BBucket
    Properties:
      BucketName: !Sub "${AWS::StackName}-e2b-${AWS::AccountId}"
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-e2b-bucket"

  LokiBucket:
    Type: AWS::S3::Bucket
    Condition: CreateLokiBucket
    Properties:
      BucketName: !Sub "${AWS::StackName}-loki-${AWS::AccountId}"
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-loki-bucket"

  # TEMPLATE_BUCKET_NAME - sandbox template snapshots written by orchestrator
  # and template-manager.
  TemplatesBucket:
    Type: AWS::S3::Bucket
    Condition: CreateTemplatesBucket
    Properties:
      BucketName: !Sub "${AWS::StackName}-templates-${AWS::AccountId}"
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-templates-bucket"

  # BUILD_CACHE_BUCKET_NAME - layer cache for template builds.
  BuildCacheBucket:
    Type: AWS::S3::Bucket
    Condition: CreateBuildCacheBucket
    Properties:
      BucketName: !Sub "${AWS::StackName}-build-cache-${AWS::AccountId}"
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-build-cache-bucket"

  # ------------------------------------------------------------------------------------------------
  # RDS Database - PostgreSQL database for E2B platform data persistence
  # ------------------------------------------------------------------------------------------------
  DBSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: Subnet group defining which private subnets can host the PostgreSQL database
      SubnetIds:
        - !Ref ExistingPrivateSubnet1Id
        - !Ref ExistingPrivateSubnet2Id
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-postgres-subnet-group"

  AuroraCluster:
    Type: AWS::RDS::DBCluster
    Properties:
      Engine: aurora-postgresql
      EngineVersion: 16.8
      Port: 5432
      DBClusterIdentifier:
        Fn::Join:
          - "-"
          - - Ref: "AWS::StackName"
            - Ref: "DBInstanceIdentifier"
      DBClusterParameterGroupName: default.aurora-postgresql16
      DBSubnetGroupName: !Ref DBSubnetGroup
      DatabaseName: !Ref DBName
      MasterUsername: !Ref DBUsername
      MasterUserPassword: !Ref DBPassword
      ServerlessV2ScalingConfiguration:
        MinCapacity: 0.5
        MaxCapacity: 4
      StorageEncrypted: true
      DeletionProtection: !If [IsProd, true, false]
      VpcSecurityGroupIds:
        - !GetAtt DBSecurityGroup.GroupId
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-aurora"

  AuroraInstance:
    Type: AWS::RDS::DBInstance
    Properties:
      Engine: aurora-postgresql
      DBInstanceIdentifier:
        Fn::Join:
          - "-"
          - - Ref: "AWS::StackName"
            - Ref: "DBInstanceIdentifier"
      DBClusterIdentifier: !Ref AuroraCluster
      DBInstanceClass: db.serverless
      PubliclyAccessible: false
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-aurora-instance"

  # ------------------------------------------------------------------------------------------------
  # ElastiCache Redis - Redis cache for E2B platform
  # ------------------------------------------------------------------------------------------------
  RedisSubnetGroup:
    Type: AWS::ElastiCache::SubnetGroup
    Properties:
      Description: Subnet group for Redis cache
      SubnetIds:
        - !Ref ExistingPrivateSubnet1Id
        - !Ref ExistingPrivateSubnet2Id
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-redis-subnet-group"

  RedisServerless:
    Type: AWS::ElastiCache::ServerlessCache
    Properties:
      Engine: redis
      ServerlessCacheName: !Sub "${AWS::StackName}-redis"
      SecurityGroupIds:
        - !GetAtt RedisSecurityGroup.GroupId
      SubnetIds:
        - !Ref ExistingPrivateSubnet1Id
        - !Ref ExistingPrivateSubnet2Id
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-redis"

  # ------------------------------------------------------------------------------------------------
  # EC2 Instance - Terraform Bastion Host for infrastructure management
  # ------------------------------------------------------------------------------------------------
  BastionInstance:
    Type: AWS::EC2::Instance
    Metadata:
      Comment: "Terraform Bastion Host for deploying and managing E2B infrastructure components"
    Properties:
      InstanceType: !If
        - IsX64
        - c7i.xlarge
        - c7g.xlarge
      KeyName: !Ref KeyName
      MetadataOptions:
        HttpTokens: required
        HttpEndpoint: enabled
      IamInstanceProfile: !Ref EC2InstanceProfile
      SubnetId: !Ref ExistingPrivateSubnet1Id
      SourceDestCheck: false
      EbsOptimized: true
      Monitoring: true
      ImageId: !If
        - IsX64
        - "{{resolve:ssm:/aws/service/canonical/ubuntu/server/22.04/stable/current/amd64/hvm/ebs-gp2/ami-id}}"
        - "{{resolve:ssm:/aws/service/canonical/ubuntu/server/22.04/stable/current/arm64/hvm/ebs-gp2/ami-id}}"
      BlockDeviceMappings:
        - DeviceName: /dev/sda1
          Ebs:
            # 100 GiB, not 40: the deploy chain builds every service image on
            # this host. A single run leaves ~15 GB of images plus ~10 GB of
            # buildx cache in /var/lib/docker and a few GB of Go build cache,
            # which filled a 40 GiB root mid-build and failed the link step with
            # "no space left on device".
            VolumeSize: 100
            VolumeType: gp3
            Encrypted: true
      SecurityGroupIds:
        - !Ref BastionSecurityGroup
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-bastion"
      UserData: !Base64
        Fn::Join:
          - ""
          - - |
              #!/bin/bash -v
              set -e
              # One log for the whole bootstrap. Everything below - the apt work,
              # the tool downloads, the clone and every deploy step - is written
              # through this one stream, so /tmp/e2b.log is the single file to
              # read when a bootstrap goes wrong, instead of half the output
              # sitting somewhere else. Nothing further down redirects to the log
              # by hand; adding such a redirect would take that command back out
              # of cloud-init-output.log.
              #
              # tee keeps the stream flowing to /var/log/cloud-init-output.log as
              # well, which is all the EC2 console has to show when the instance
              # never gets far enough to SSH into.
              #
              # -a rather than truncating: a re-run through cloud-init, or a
              # manual re-run of a step, appends to the existing history.
              exec > >(tee -a /tmp/e2b.log) 2>&1
            - |
              export DEBIAN_FRONTEND=noninteractive
              systemctl stop apt-daily.service apt-daily-upgrade.service unattended-upgrades.service || true
              systemctl kill apt-daily.service apt-daily-upgrade.service unattended-upgrades.service || true
              systemctl disable apt-daily.timer apt-daily-upgrade.timer || true
              systemctl mask apt-daily.service apt-daily-upgrade.service unattended-upgrades.service || true
              killall -9 apt-get apt dpkg unattended-upgr 2>/dev/null || true
              for i in $(seq 1 60); do if fuser /var/lib/dpkg/lock /var/lib/dpkg/lock-frontend /var/lib/apt/lists/lock /var/cache/apt/archives/lock >/dev/null 2>&1; then echo "Apt lock held, waiting... ($i/60)"; sleep 5; else echo "Apt locks released."; break; fi; done
              sleep 5
              apt-get clean
            - |
              # Update system packages to latest versions
              apt update -y
            - |
              # Install Go programming language for building E2B components
              snap install go --classic
            - |
              # Install essential development and deployment tools
              # build-essential is required, not optional: the orchestrator and
              # template-manager binaries are compiled on this host (not in a
              # container) and packages/orchestrator/Makefile builds them with
              # CGO_ENABLED=1, because pkg/sandbox/uffd/userfaultfd binds
              # linux/userfaultfd.h through cgo. Without a C compiler the build
              # step fails with: cgo: C compiler "gcc" not found.
              apt install unzip docker.io make jq postgresql-client-common git build-essential -y
            - |
              # Install PostgreSQL client for database management
              apt install postgresql-client -y
            - |
              # Setup Docker buildx for multi-architecture container builds
              mkdir -p /root/.docker/cli-plugins
            - !If
              - IsX64
              - |
                wget -O /root/.docker/cli-plugins/docker-buildx https://github.com/docker/buildx/releases/download/v0.21.1/buildx-v0.21.1.linux-amd64
                wget -O /opt/awscli.zip https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip
                wget -O /opt/packer.zip https://releases.hashicorp.com/packer/1.12.0/packer_1.12.0_linux_amd64.zip
                wget -O /opt/terraform.zip https://releases.hashicorp.com/terraform/1.7.5/terraform_1.7.5_linux_amd64.zip
                wget -O /opt/nomad.zip https://releases.hashicorp.com/nomad/1.8.4/nomad_1.8.4_linux_amd64.zip
              - |
                wget -O /root/.docker/cli-plugins/docker-buildx https://github.com/docker/buildx/releases/download/v0.21.1/buildx-v0.21.1.linux-arm64
                wget -O /opt/awscli.zip https://awscli.amazonaws.com/awscli-exe-linux-aarch64.zip
                wget -O /opt/packer.zip https://releases.hashicorp.com/packer/1.12.0/packer_1.12.0_linux_arm64.zip
                wget -O /opt/terraform.zip https://releases.hashicorp.com/terraform/1.7.5/terraform_1.7.5_linux_arm64.zip
                wget -O /opt/nomad.zip https://releases.hashicorp.com/nomad/1.8.4/nomad_1.8.4_linux_arm64.zip
            - |
              chmod +x /root/.docker/cli-plugins/docker-buildx
            - |
              cd /opt
            - |
              # Install AWS CLI for infrastructure management
              unzip awscli.zip && ./aws/install && rm awscli.zip
            - !Sub |
              # Configure AWS CLI default region
              aws configure set region ${AWS::Region}
            - |
              # Install the HashiCorp tools.
              #
              # -o overwrites without prompting and the steps are not chained on
              # &&: unzip exits 1 on non-fatal warnings, which silently aborted
              # the rest of the chain and left the binary sitting in /opt
              # instead of on PATH.
              install_hashicorp_tool() {
                TOOL=$1
                unzip -o "/opt/$TOOL.zip" "$TOOL" -d /opt
                install -m 0755 "/opt/$TOOL" "/usr/local/bin/$TOOL"
                rm -f "/opt/$TOOL.zip" "/opt/$TOOL"
                "/usr/local/bin/$TOOL" version | head -1
              }
              install_hashicorp_tool packer
              install_hashicorp_tool terraform
              install_hashicorp_tool nomad
            - !Sub |
              # --branch checks out ${RepoBranch} as part of the clone and fails
              # loudly when that branch does not exist, rather than silently leaving
              # the tree on the remote's default branch. That silent fallback is how
              # a bastion ends up running main when it was meant to run the
              # deployment branch, and the mismatch only surfaces much later as
              # missing files or a stale job spec - deploy-all.sh, which the chain
              # below invokes, is one of the files that would be missing.
              #
              # A directory that already has content is left untouched, so a tree
              # delivered by rsync/scp is never clobbered. Without that guard
              # git clone fails on a non-empty directory and set -e above turns
              # that into a failed bootstrap.
              mkdir -p /opt/infra
              if [ -n "$(ls -A /opt/infra/sample-e2b-on-aws 2>/dev/null)" ]; then
                echo "RepoDir=already-populated, left as is"
              elif git clone --branch "${RepoBranch}" \
                   https://github.com/aws-samples/sample-e2b-on-aws.git \
                   /opt/infra/sample-e2b-on-aws; then
                echo "RepoBranch=${RepoBranch}"
              else
                echo "RepoClone=FAILED for branch ${RepoBranch}, deliver the tree by hand"
                mkdir -p /opt/infra/sample-e2b-on-aws
              fi
              # UserData runs as root, so the clone lands root-owned and git then
              # refuses to operate for the login user ("detected dubious ownership").
              # Hand the tree to ubuntu, which is who drives anything manual and who
              # VS Code Remote-SSH connects as. Steps that need root still work -
              # root can write regardless of owner.
              chown -R ubuntu:ubuntu /opt/infra/sample-e2b-on-aws
              cd /opt/infra/sample-e2b-on-aws
              git rev-parse --abbrev-ref HEAD || true
            - !Sub |
              # Initialize Configuration.
              #
              # infra-iac/init.sh resolves the stack by grepping StackName out of
              # /tmp/e2b.log. That grep is anchored on ^StackName=, so the
              # bash -v trace of this line - which the funnel also captures -
              # cannot be read as the value.
              echo "StackName=${AWS::StackName}"
            - |
              # The chain itself lives in deploy-all.sh, which is also what a
              # manual run uses, so the step order and the checkpoint names are
              # defined once rather than drifting between this template and the
              # instructions people follow by hand.
              #
              # The script waits for the stack to reach CREATE_COMPLETE before
              # its first step, which is what makes it safe to start here while
              # the stack is still coming up, and it records
              # /opt/.e2b-step-<name>.done per step so a later re-run resumes
              # instead of repeating work.
              #
              # E2B_LOG_FUNNEL tells it the single log stream is already open, so
              # it does not tee into /tmp/e2b.log a second time and write every
              # line twice. set -e above turns a failed chain into a failed
              # bootstrap.
              E2B_LOG_FUNNEL=1 bash /opt/infra/sample-e2b-on-aws/deploy-all.sh

# ===================================================================================================
# Outputs - Values exported after stack creation for reference by other stacks
# ===================================================================================================
Outputs:
  # Database outputs
  DBEndpoint:
    Description: Aurora PostgreSQL database connection endpoint address
    Value: !GetAtt AuroraCluster.Endpoint.Address

  DBReaderEndpoint:
    Description: Aurora PostgreSQL database reader endpoint address
    Value: !GetAtt AuroraCluster.ReadEndpoint.Address

  # Stack information
  CFNSTACKNAME:
    Description: CloudFormation stack name for reference in other templates
    Value: !Ref AWS::StackName
    Export:
      Name: !Sub "${AWS::StackName}-CFNSTACKNAME"

  # VPC outputs
  CFNVPCID:
    Description: VPC ID for the E2B infrastructure network
    Value: !Ref ExistingVpcId
    Export:
      Name: !Sub "${AWS::StackName}-CFNVPCID"

  CFNVPCCIDR:
    Description: VPC CIDR Block defining the overall network address space (automatically retrieved)
    Value: !GetAtt VpcCidrLookup.CidrBlock
    Export:
      Name: !Sub "${AWS::StackName}-CFNVPCCIDR"

  # Public Access Configuration
  CFNPUBLICACCESS:
    Description: Public or Private access configuration
    Value: !Ref PublicAccess
    Export:
      Name: !Sub "${AWS::StackName}-CFNPUBLICACCESS"

  # Subnet outputs
  CFNPRIVATESUBNET1:
    Description: Private Subnet ID in first availability zone for secure resources
    Value: !Ref ExistingPrivateSubnet1Id
    Export:
      Name: !Sub "${AWS::StackName}-CFNPRIVATESUBNET1"

  CFNPRIVATESUBNET2:
    Description: Private Subnet ID in second availability zone for secure resources
    Value: !Ref ExistingPrivateSubnet2Id
    Export:
      Name: !Sub "${AWS::StackName}-CFNPRIVATESUBNET2"

  CFNPUBLICSUBNET1:
    Description: Public Subnet ID in first availability zone for internet-facing resources
    Value: !Ref ExistingPublicSubnet1Id
    Export:
      Name: !Sub "${AWS::StackName}-CFNPUBLICSUBNET1"

  CFNPUBLICSUBNET2:
    Description: Public Subnet ID in second availability zone for internet-facing resources
    Value: !Ref ExistingPublicSubnet2Id
    Export:
      Name: !Sub "${AWS::StackName}-CFNPUBLICSUBNET2"

  # S3 bucket outputs
  CFNE2BBUCKET:
    Description: Unified E2B S3 bucket name
    Value:
      !If [HasExternalE2BBucket, !Ref ExistingE2BBucketName, !Ref E2BBucket]
    Export:
      Name: !Sub "${AWS::StackName}-CFNE2BBUCKET"

  CFNLOKIBUCKET:
    Description: Loki log storage S3 bucket name
    Value:
      !If [HasExternalLokiBucket, !Ref ExistingLokiBucketName, !Ref LokiBucket]
    Export:
      Name: !Sub "${AWS::StackName}-CFNLOKIBUCKET"

  CFNTEMPLATESBUCKET:
    Description: Sandbox template S3 bucket name (orchestrator TEMPLATE_BUCKET_NAME)
    Value:
      !If [
        HasExternalTemplatesBucket,
        !Ref ExistingTemplatesBucketName,
        !Ref TemplatesBucket,
      ]
    Export:
      Name: !Sub "${AWS::StackName}-CFNTEMPLATESBUCKET"

  CFNBUILDCACHEBUCKET:
    Description: Template build cache S3 bucket name (orchestrator BUILD_CACHE_BUCKET_NAME)
    Value:
      !If [
        HasExternalBuildCacheBucket,
        !Ref ExistingBuildCacheBucketName,
        !Ref BuildCacheBucket,
      ]
    Export:
      Name: !Sub "${AWS::StackName}-CFNBUILDCACHEBUCKET"

  # SSH key output
  CFNSSHKEY:
    Description: EC2 SSH Key Name for bastion host access
    Value: !Ref KeyName
    Export:
      Name: !Sub "${AWS::StackName}-CFNSSHKEY"

  # Database connection string (password stored separately in Secrets Manager)
  CFNDBURL:
    Description: PostgreSQL connection string (password stored in Secrets Manager)
    Value: !Sub
      - "postgresql://${DBUsername}@${DBEndpoint}/${DBName}"
      - DBEndpoint: !GetAtt AuroraCluster.Endpoint.Address
    Export:
      Name: !Sub "${AWS::StackName}-CFNDBURL"

  CFNDBCredentialSecretName:
    Description: Secrets Manager secret name for database credentials
    Value: !Sub "e2b-${AWS::StackName}-db-credential"
    Export:
      Name: !Sub "${AWS::StackName}-CFNDBCredentialSecretName"

  # Domain and certificate outputs
  CFNDOMAIN:
    Description: Base domain name for E2B services
    Value: !Ref BaseDomain
    Export:
      Name: !Sub "${AWS::StackName}-CFNDOMAIN"

  CFNCERTARN:
    Description: SSL Certificate ARN for HTTPS endpoints
    Value: !Ref WildcardCertificate
    Export:
      Name: !Sub "${AWS::StackName}-CFNCERTARN"

  # Load balancer outputs.
  #
  # The target group ARNs reach Terraform through infra-iac/init.sh ->
  # /opt/config.properties -> infra-iac/terraform/prepare.sh -> var.tf, where the
  # autoscaling attachments consume them. CFNALBDNS is the value the wildcard DNS
  # record points at; because the load balancer now lives here rather than in
  # Terraform, it survives terraform destroy/apply and only has to be set once.
  CFNALBDNS:
    Description: Application Load Balancer DNS name. Point *.{BaseDomain} at this.
    Value: !GetAtt ApplicationLoadBalancer.DNSName
    Export:
      Name: !Sub "${AWS::StackName}-CFNALBDNS"

  CFNNOMADSERVERTGARN:
    Description: Nomad server target group ARN, attached to the server ASG by Terraform
    Value: !Ref NomadServerTargetGroup
    Export:
      Name: !Sub "${AWS::StackName}-CFNNOMADSERVERTGARN"

  CFNE2BAPITGARN:
    Description: E2B API target group ARN, attached to the API ASG by Terraform
    Value: !Ref E2BApiTargetGroup
    Export:
      Name: !Sub "${AWS::StackName}-CFNE2BAPITGARN"

  CFNCLIENTPROXYTGARN:
    Description: Client proxy target group ARN, attached to the API ASG by Terraform
    Value: !Ref ClientProxyTargetGroup
    Export:
      Name: !Sub "${AWS::StackName}-CFNCLIENTPROXYTGARN"

  # Redis outputs
  REDISNAME:
    Description: Redis cache name
    Value: !Sub "${AWS::StackName}-redis"
    Export:
      Name: !Sub "${AWS::StackName}-CFNREDISNAME"

  REDISENDPOINT:
    Description: Complete Redis connection string for application configuration
    Value: !GetAtt RedisServerless.Endpoint.Address
    Export:
      Name: !Sub "${AWS::StackName}-CFNREDISURL"

  ENVIRONMENT:
    Description: E2B Environment
    Value: !Ref Environment
    Export:
      Name: !Sub "${AWS::StackName}-CFNENVIRONMENT"

  ARCHITECTURE:
    Description: E2B Cluster CPU Architecture
    Value: !Ref Architecture
    Export:
      Name: !Sub "${AWS::StackName}-CFNARCHITECTURE"

  CLIENTINSTANCETYPE:
    Description: Instance type for client cluster
    Value: !If
      - HasCustomClientInstanceType
      - !Ref ClientInstanceType
      - !If
        - IsX64
        - c5.metal
        - c7g.metal
    Export:
      Name: !Sub "${AWS::StackName}-CFNCLIENTINSTANCETYPE"

  REGION:
    Description: E2B Cluster Deployment Region
    Value: !Ref AWS::Region
    Export:
      Name: !Sub "${AWS::StackName}-AWSREGION"

  STACKNAME:
    Description: CloudFormation Stack Name
    Value: !Ref AWS::StackName
    Export:
      Name: !Sub "${AWS::StackName}-AWSSTACKNAME"

  CFNCustomScriptUrl:
    Description: Custom script URL for instance startup
    Value: !Ref CFNCustomScriptUrl

  # Bastion Host information
  # BASTIONPUBLICDNS:
  #   Description: Public DNS name of the Bastion Host for SSH access
  #   Value: !GetAtt BastionInstance.PublicDnsName

  # BASTIONPUBLICIP:
  #   Description: Public IP address of the Bastion Host for SSH access
  #   Value: !GetAtt BastionInstance.PublicIp
